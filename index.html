<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAQS Web Agency | Premium Web & AI Solutions</title>
    <meta name="description" content="DAQS Web Agency — We build stunning websites, AI automation systems, and digital marketing solutions for growth-focused SMEs across the UK and Africa." />

    <!-- DNS prefetch & preconnect for external origins -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts — non-blocking via media trick -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;600;700;800&display=swap" />
    </noscript>

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph -->
    <meta property="og:title" content="DAQS Web Agency | Premium Web & AI Solutions" />
    <meta property="og:description" content="Stunning websites, AI automation & digital marketing for SMEs." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://daqswebagency.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
